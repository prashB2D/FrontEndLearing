<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            border: 2px solid rgb(221, 255, 0);
            height: 600px;
            display: grid;
            gap: 10px 10px; 
            grid-template-columns: 200px 200px 200px;         /* in this we can spicfive that this can take this much of th spce like 2f == take 2 box spce */

        }
        /* .box{
            background-color: aqua;

         #box1{
            background-color: aqua;
             /* grid-column: 1/4; */
            grid-column: 1/4; 
         
           /* grid-column-start: 1;  
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 5; */
              } 
              #box2{
                background-color: aqua;
                 grid-row: 2/4; 
              }
              #box3{
                background-color: aqua;
                 grid-column: 2/4; 
              }
              #box4{
                background-color: aqua;
                    grid-row: 3/4;
              }
              #box5{

              }
                #box6{

              }
                #box7{

                grid-column: 1/4;
                    grid-column: 0/4;
              }
            
        *{
            margin: 0;
            padding: 0;
        }
       .box{
           background-color: rgb(17, 211, 211);
            border: 2px solid black; 
            /* height: 100px; */
        }

</head>

        <div id="box3" class="box">Box 3</div>
        <!-- <div id="box4" class="box">Box 4</div> -->
