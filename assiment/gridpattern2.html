<!DOCTYPE html>
<html>
<head>
<style>

*{
    margin:0;
    padding:0;
}

.main{

    width:650px;
    height:700px;

    border:2px solid rgb(255, 234, 3);

    display:grid;

    gap:10px;

    grid-template-columns:170px 180px 170px;

    grid-template-rows:180px 110px 80px 190px;

}

.box{

    border:2px solid rgb(51, 57, 22);

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:20px;
    font-weight:bold;

}


#box1{
    background:steelblue;

    grid-column:1/2;
    grid-row:1/3;
}



#box2{
    background:orange;

    grid-column:2/3;
    grid-row:1/2;
}



#box3{
    background:steelblue;

    grid-column:3/4;
    grid-row:1/2;
}



#box4{
    background:rgb(20, 59, 255);

    grid-column:2/3;
    grid-row:2/3;
}


#box5{
    background:cyan;

    grid-column:3/4;
    grid-row:2/4;
}



#box6{
    background:cyan;

    grid-column:1/2;
    grid-row:3/4;
}



#box7{
    background:steelblue;

    grid-column:2/3;
    grid-row:3/4;
}



#box8{
    background:orange;

    grid-column:1/2;
    grid-row:4/5;
}



#box9{
    background:deeppink;

    grid-column:2/4;
    grid-row:4/5;
}

</style>
</head>

<body>

<div class="main">

<div class="box" id="box1">Box 1</div>

<div class="box" id="box2">Box 2</div>

<div class="box" id="box3">Box 3</div>

<div class="box" id="box4">Box 4</div>

<div class="box" id="box5">Box 5</div>

<div class="box" id="box6">Box 6</div>

<div class="box" id="box7">Box 7</div>

<div class="box" id="box8">Box 8</div>

<div class="box" id="box9">Box 9</div>

</div>

</body>
</html>
