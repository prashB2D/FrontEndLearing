        }

        }
           .container-5{
            width: 300px;
            height: 400px;

             border-right: 2px dotted white;

        }
        
         .child{
            width: 100px;
            height: 100px;
            background-color: blueviolet;
            /* transform: translateX(100px);
            transform: translateY(100px); */
            /* transform: translate(200px,200px); */
            /* transform: rotate(350deg); */
            /* transform: rotateX(45deg); */
            /* transform: rotateY(45deg); */
            /* transform: scale(3,3); */
            /* transform: scaleX(2); */
            /* transform: scaleY(2); */
            /* transform: skew(45deg,25deg); */
            /* transform: skewX(85deg); */
            /* transform: skewY(85deg); */
           
            /* transform-origin:bottom ; */
             /* transform: rotate(45deg); */
             /* transition-property: all; */
             /* transition-duration: 3s; */
             /* transition-timing-function: ease-in-out; */
             /* transition-timing-function: cubic-bezier(0.78, -0.42, 0.29, 0.6); */
             /* transition-delay: 2s; */
             animation-name: boom;
             animation-duration: 6s;
             /* animation-delay: 2s; */
             animation-timing-function:ease;
             animation-iteration-count:1;
             /* animation-direction: alternate-reverse; */
             /* animation-direction:reverse; */
             animation-direction: normal;
             

             
         }
         /* .child:hover{ */
            /* transform: translate(300px,-400px) rotate(45deg); */
            /* transform: translateX(500px);
            background-color: brown;
            border-radius: 50%; */
         /* } */
         @keyframes boom {
            /* from{
                transform: translate(0px,0px) rotate(0deg);
            }
            to{
                transform: translate(500px,300px) rotate(360deg);
                 border-radius: 50%;
            } */
            0%{
                transform: translate(0px,0px) rotate(0deg);
            }
            10%{
                transform: translate(0px,300px) rotate(360deg);
            }
            20%{
                transform: translate(250px,300px) rotate(360deg);
            }
            30%{
                transform: translate(250px,0px) rotate(360deg);
            }
            40%{
                 transform: translate(500px,0px) rotate(360deg);
            }
            50%{
                 transform: translate(500px,10px) rotate(360deg);
            }
             60%{
                 transform: translate(500px,300px) rotate(360deg);
            }
            70%{
                 transform: translate(800px,300px) rotate(360deg);
            }
            80%{
                 transform: translate(800px,0px) rotate(360deg);
            }
             85%{
                 transform: translate(1100px,0px) rotate(360deg);
                 
            }
             90%{
                 transform: translate(1100px,300px) rotate(360deg);
                 
            }
             95%{
                 transform: translate(1400px,300px) rotate(360deg);
                 
            }
            100%{
                 transform: translate(1400px,0px) rotate(360deg);
                 
            }

            
            
         }
    </style>
</head>

    </div>
