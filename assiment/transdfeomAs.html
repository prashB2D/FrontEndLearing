<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform Positioning</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        .main {
            width: 600px;
            height: 600px;
            border: 2px solid yellow;
            position: relative;
        }

      
        .box {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 10px;
            overflow: hidden;
        }

     
        .box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
          
            display: block;
        }


        #box1 {
            transform: translate(12px, 12px);
            background-color: aqua;
        }

        #box2 {
            transform: translate(120px, 400px) scaleX(2);
            background-color: aqua;
        }

        #box3 {
            transform: translate(488px, 12px);
            background-color: aqua;
        }

        #box4 {
            transform: translate(120px, 140px) scaleX(2);
            background-color: aqua;
        }

        #box5 {
            transform: translate(250px, 250px) rotate(45deg);
            background-color: aqua;
        }

        #box6 {
            transform: translate(410px, 140px) scaleX(2);
            background-color: aqua;
        }

        #box7 {
            transform: translate(12px, 488px);
            background-color: aqua;
        }

        #box8 {
            transform: translate(410px, 400px) scaleX(2);
            background-color: aqua;
        }

        #box9 {
            transform: translate(498px, 498px);
            background-color: aqua;
        }
    </style>

</head>

<body>

    <div class="main">

        <div class="box" id="box1">
            <img src="https://picsum.photos/id/10/800/600" alt="">
        </div>

        <div class="box" id="box2">
            <img src="https://picsum.photos/id/10/800/600" alt="">
        </div>

        <div class="box" id="box3">
            <img src="https://picsum.photos/id/10/800/600" alt="">
        </div>

        <div class="box" id="box4">
            <img src="https://picsum.photos/id/10/800/600" alt="">
        </div>

        <div class="box" id="box5">
            <img src="https://picsum.photos/id/10/800/600" alt="">
        </div>

        <div class="box" id="box6">
            <img src="https://picsum.photos/id/10/800/600" alt="">
        </div>

        <div class="box" id="box7">
            <img src="https://picsum.photos/id/10/800/600" alt="">
        </div>

        <div class="box" id="box8">
            <img src="https://picsum.photos/id/10/800/600" alt="">
        </div>

        <div class="box" id="box9">
            <img src="https://picsum.photos/id/10/800/600" alt="">
        </div>

    </div>

</body>

</html>
