<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Path</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .main {
            width: 700px;
            height: 180px;
            /* border: 4px solid red; */
            display: flex;
            position: relative;
        }

        .box1 {
            width: 100px;
            height: 180px;
             border-left: 4px dotted dodgerblue;
            border-right: 4px dotted dodgerblue;
            border-bottom: 4px dotted dodgerblue;

        }

        .box2 {
            width: 100px;
            height: 180px;
            border-right: 4px dotted dodgerblue;
            border-top: 4px dotted dodgerblue;


        }

        .box3 {
            width: 100px;
            height: 180px;
            border-right: 4px dotted dodgerblue;
            border-bottom: 4px dotted dodgerblue;

        }

        .box4 {
            width: 100px;
            height: 180px;
            border-right: 4px dotted dodgerblue;
            border-top: 4px dotted dodgerblue;


        }

        .box5 {
            width: 100px;
            height: 180px;
            border-right: 4px dotted dodgerblue;
            border-bottom: 4px dotted dodgerblue;

        }

        .box6 {
            width: 100px;
            height: 180px;
            border-right: 4px dotted dodgerblue;
            border-top: 4px dotted dodgerblue;

        }

        .box:last-child {
            border-right: none;
        }

        .car {
            width: 20px;
            height: 20px;
            background: rgb(183, 255, 0);
            width: 5px;
            position: absolute;
            animation: move 12s linear infinite;
        }

        @keyframes move {



            0% {
                left: 0;
                top: 0;
            }

            10% {
                left: 0;
                top: 160px;
            }

            20% {
                left: 100px;
                top: 160px;
            }

            30% {
                left: 100px;
                top: 0;
            }



            40% {
                left: 200px;
                top: 0;
            }

            50% {
                left: 200px;
                top: 160px;
            }

            60% {
                left: 300px;
                top: 160px;
            }

            70% {
                left: 300px;
                top: 0;
            }



            80% {
                left: 400px;
                top: 0;
            }

            90% {
                left: 400px;
                top: 160px;
            }

            100% {
                left: 500px;
                top: 160px;
            }

        }
    </style>

</head>

<body>

    <div class="main">

        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
        <div class="box5"></div>
        <div class="box6"></div>

        <div class="car"></div>

    </div>

</body>

</html>
