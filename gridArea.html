<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            border: 2px solid rgb(221, 255, 0);
            height: 600px;
            display: grid;
            gap: 10px 10px; 
            grid-template-columns: 100px 200px 200px;         /* in this we can spicfive that this can take this much of th spce like 2f == take 2 box spce */

        }
        *{
            margin: 0;
            padding: 0;
        }
       .box{
           background-color: rgb(17, 211, 211);
            border: 2px solid black; 
            padding: 10px;

            /* height: 100px; */
        }
        #box1{
            background-color: brown;
            grid-area: 1/1/3/3;
            /* justify-self: center;
            align-self: center; */
            place-self: center left; ;
        }
    </style>
</head>
<body>
    <div class="main">
        <div id="box1" class="box">Box 1</div>
        <div id="box2" class="box">Box 2</div>
        <div id="box3" class="box">Box 3</div>
        <div id="box4" class="box">Box 4</div>
        <div id="box5" class="box">Box 5</div>
        <div id="box6" class="box">Box 6</div>
        <div id="box7" class="box">Box 7</div>
        <div id="box8" class="box">Box 8</div>
        <div id="box9" class="box">Box 9</div>
        <div id="box10" class="box">Box 10</div>
        <div id="box11" class="box">Box 11</div>
        
    
    </div>
</body>
</html>
