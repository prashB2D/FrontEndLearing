<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dropdown</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
</head>

<body>
    <script>
        let select = React.createElement("select", { defaultValue: "react" },
            React.createElement("option", { value: "react" }, "React"),
            React.createElement("option", { value: "vue" }, "Vue"),
            React.createElement("option", { value: "angular" }, "Angular")
        );
        ReactDOM.createRoot(document.body).render(select);
    </script>
</body>

</html>
